name: AI review

on:
  pull_request_target:
    types: [labeled]

permissions: {}

jobs:
  review:
    if: >-
      github.event.label.name == 'ai-review' &&
      github.event.pull_request.state == 'open' &&
      !github.event.pull_request.draft &&
      github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: ai-review-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Check out the trusted workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: reviewer
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Build the trusted reviewer
        working-directory: reviewer
        run: ./gradlew --no-daemon --console=plain installDist
      - name: Run the reviewer
        working-directory: reviewer
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: build/install/ai-reviewer/bin/ai-reviewer
